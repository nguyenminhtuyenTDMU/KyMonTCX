# Build app offline (Flet) cho Android / Windows / macOS / Linux.
# Chạy tay ở tab Actions (Run workflow) hoặc tự chạy khi push tag dạng v1.0.0.
# File cài đặt nằm trong mục "Artifacts" của lần chạy.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: apk,     name: android-apk }
          - { os: windows-latest, target: windows, name: windows }
          - { os: macos-latest,   target: macos,   name: macos }
          - { os: ubuntu-latest,  target: linux,   name: linux }
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java 17 (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Thư viện hệ thống (Linux desktop)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Cài Flet
        run: pip install "flet[all]==1.0.3"

      - name: flet build ${{ matrix.target }}
        run: flet build ${{ matrix.target }} --yes --no-rich-output --skip-flutter-doctor --build-number ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: kymontcx-${{ matrix.name }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
